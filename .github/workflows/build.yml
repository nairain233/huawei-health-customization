name: Preview Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build release APK
        run: bash ./gradlew testDebugUnitTest lintDebug assembleRelease --no-configuration-cache

      - name: Sign and verify release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          umask 077
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          mkdir -p "app/build/outputs/signed"
          "$build_tools/zipalign" -P 16 -f 4 \
            "app/build/outputs/apk/release/app-release-unsigned.apk" \
            "$RUNNER_TEMP/app-release-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "app/build/outputs/signed/huaweihook-release.apk" \
            "$RUNNER_TEMP/app-release-aligned.apk"
          "$build_tools/apksigner" verify "app/build/outputs/signed/huaweihook-release.apk"
          "$build_tools/zipalign" -c -P 16 4 "app/build/outputs/signed/huaweihook-release.apk"

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          preview_tag="preview-$(date -u +'%Y%m%d-%H%M%S')"
          preview_apk="app/build/outputs/signed/pre-release-${GITHUB_RUN_NUMBER}.apk"
          mv "app/build/outputs/signed/huaweihook-release.apk" "$preview_apk"

          while IFS= read -r old_tag; do
            [[ -z "$old_tag" ]] && continue
            echo "Removing previous preview release: $old_tag"
            gh release delete "$old_tag" --yes --cleanup-tag
          done < <(
            gh release list --prerelease --limit 100 \
              --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease and (.tagName | startswith("preview-"))) | .tagName'
          )

          cat > "$RUNNER_TEMP/preview-notes.md" <<'EOF'
          ## 这是自动构建的最新测试版。

          - **这是一个预发布版本，并非为生产环境准备就绪。**

          ## This is an automatically built latest Preview release.

          - **This is a pre-release version and is not intended for production use.**
          EOF

          gh release create "$preview_tag" "$preview_apk" \
            --title "Preview $preview_tag" \
            --notes-file "$RUNNER_TEMP/preview-notes.md" \
            --prerelease
